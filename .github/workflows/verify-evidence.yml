name: verify-evidence

# 只读的CPU数值核查：重算保存证据中的特征、拟合、预测与统计区间。
# 通过仅代表数值可复核，不代表任何研究假设成立。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是 README 记录的本地验证环境；3.14 用于确认核查不依赖特定版本。
        python-version: ['3.12', '3.14']

    steps:
      - name: Check out evidence
        uses: actions/checkout@v4
        # .gitattributes 设有 `* -text`，保证证据文件字节不被换行转换改写，
        # 否则 SHA256 校验会在 Linux 上失配。

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned evidence dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-evidence.txt

      - name: Record environment
        run: |
          python -c "import sys, numpy; print('python', sys.version.split()[0]); print('numpy', numpy.__version__)"

      - name: Run CPU numerical audit
        id: audit
        # 用重定向而非管道：默认 shell 不带 pipefail，`| tee` 会吞掉 Python 的非零退出码。
        # 失败信息走 stderr，仍会直接出现在日志里。
        run: |
          python scripts/verify_evidence.py > audit-report.json
          cat audit-report.json

      - name: Publish audit report to job summary
        if: always()
        run: |
          {
            echo "## CPU 数值核查 (Python ${{ matrix.python-version }})"
            echo ""
            if [ -s audit-report.json ]; then
              echo '```json'
              cat audit-report.json
              echo '```'
            else
              echo "核查未产生报告，见上方步骤日志。"
            fi
            echo ""
            echo "_通过仅代表保存证据的数值可复核，不代表算法假设通过、也不构成独立复现。_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-py${{ matrix.python-version }}
          path: audit-report.json
          if-no-files-found: warn

  manifest-integrity:
    runs-on: ubuntu-latest
    # 纯标准库、与Python版本无关，因此不使用上面的版本矩阵。
    # 这一步同时确认 `* -text` 在Linux checkout下确实保住了证据字节。
    steps:
      - name: Check out published snapshot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify files against PUBLICATION_MANIFEST.json
        run: |
          python scripts/verify_manifest.py > manifest-report.json
          cat manifest-report.json

      - name: Publish integrity report to job summary
        if: always()
        run: |
          {
            echo "## 发布快照完整性"
            echo ""
            if [ -s manifest-report.json ]; then
              echo '```json'
              cat manifest-report.json
              echo '```'
            else
              echo "校验未产生报告，见上方步骤日志。"
            fi
            echo ""
            echo "_仅表示发布文件字节未变，不涉及任何研究结论。_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: manifest-report.json
          if-no-files-found: warn
